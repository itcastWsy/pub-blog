<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8f0"/><stop offset="100%" stop-color="#fde8d4"/></linearGradient>
    <linearGradient id="leader" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="tm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="sup" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ca8a04"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/></marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="480" y="38" text-anchor="middle" fill="#7c2d12" font-size="21" font-weight="700">连锁餐饮采购智能协作 · 总体架构</text>
  <text x="480" y="60" text-anchor="middle" fill="#9a3412" font-size="12">食材依赖自动排序 · 多门店协调 · 每日补货</text>

  <!-- Layer 1: 门店层 -->
  <rect x="40" y="470" width="880" height="110" rx="16" fill="#fff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="60" y="494" fill="#9a3412" font-size="12" font-weight="600">多门店（库存 / 销售 / 安全水位数据源）</text>
  <g font-size="12" fill="#7c2d12">
    <rect x="70" y="508" width="150" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="145" y="532" text-anchor="middle" font-weight="600">望京店</text>
    <text x="145" y="551" text-anchor="middle" fill="#c2410c" font-size="10">库存 ERP · POS 销售</text>

    <rect x="245" y="508" width="150" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="320" y="532" text-anchor="middle" font-weight="600">国贸店</text>
    <text x="320" y="551" text-anchor="middle" fill="#c2410c" font-size="10">库存 ERP · POS 销售</text>

    <rect x="420" y="508" width="150" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="495" y="532" text-anchor="middle" font-weight="600">中关村店</text>
    <text x="495" y="551" text-anchor="middle" fill="#c2410c" font-size="10">库存 ERP · POS 销售</text>

    <rect x="595" y="508" width="150" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="670" y="532" text-anchor="middle" font-weight="600">浦东店</text>
    <text x="670" y="551" text-anchor="middle" fill="#c2410c" font-size="10">库存 ERP · POS 销售</text>

    <rect x="770" y="508" width="140" height="58" rx="14" fill="#fef3c7" stroke="#eab308"/>
    <text x="840" y="532" text-anchor="middle" font-weight="600">供应商系统</text>
    <text x="840" y="551" text-anchor="middle" fill="#a16207" font-size="10">A2A / EDI 报价</text>
  </g>

  <!-- Layer 2: 协作层 -->
  <rect x="40" y="90" width="880" height="350" rx="16" fill="#fff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="60" y="114" fill="#9a3412" font-size="12" font-weight="600">蜂群协作层 · 采购 Team（cron 每日 7:00 唤醒 + 团队记忆沉淀）</text>

  <!-- Leader -->
  <g filter="url(#soft)">
    <rect x="360" y="135" width="240" height="86" rx="20" fill="url(#leader)" opacity="0.3"/>
  </g>
  <rect x="360" y="135" width="240" height="86" rx="20" fill="url(#leader)"/>
  <text x="480" y="162" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Leader · 采购调度官</text>
  <text x="480" y="184" text-anchor="middle" fill="#ffedd5" font-size="11">汇总多门店需求 → 食材依赖排序</text>
  <text x="480" y="201" text-anchor="middle" fill="#ffedd5" font-size="11">合并同类项 / 拆单 / 人工审批高危</text>

  <!-- Teammates (胶囊形) -->
  <g font-size="12">
    <rect x="60" y="270" width="180" height="78" rx="18" fill="url(#tm)"/>
    <text x="150" y="297" text-anchor="middle" fill="#fff" font-weight="700">需求预测 Agent</text>
    <text x="150" y="316" text-anchor="middle" fill="#fecaca" font-size="10">POS 销量 + 天气/节假日</text>
    <text x="150" y="332" text-anchor="middle" fill="#fecaca" font-size="10">预测各 SKU 需求</text>

    <rect x="265" y="270" width="180" height="78" rx="18" fill="url(#tm)"/>
    <text x="355" y="297" text-anchor="middle" fill="#fff" font-weight="700">供应商比价 Agent</text>
    <text x="355" y="316" text-anchor="middle" fill="#fecaca" font-size="10">mcp_paid_search + A2A</text>
    <text x="355" y="332" text-anchor="middle" fill="#fecaca" font-size="10">拉报价 / 交期 / 起订量</text>

    <rect x="470" y="270" width="180" height="78" rx="18" fill="url(#tm)"/>
    <text x="560" y="297" text-anchor="middle" fill="#fff" font-weight="700">依赖校验 Agent</text>
    <text x="560" y="316" text-anchor="middle" fill="#fecaca" font-size="10">BOM 替代关系 + 冷链</text>
    <text x="560" y="332" text-anchor="middle" fill="#fecaca" font-size="10">排序补货优先级</text>

    <rect x="675" y="270" width="225" height="78" rx="18" fill="url(#sup)"/>
    <text x="787" y="297" text-anchor="middle" fill="#fff" font-weight="700">补货下单 Agent</text>
    <text x="787" y="316" text-anchor="middle" fill="#fde68a" font-size="10">生成采购单 → ERP/A2A 下单</text>
    <text x="787" y="332" text-anchor="middle" fill="#fde68a" font-size="10">超预算触发人工审批</text>
  </g>

  <!-- Leader -> Teammates -->
  <g stroke="#9a3412" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M420 221 C 300 245, 220 255, 155 267"/>
    <path d="M460 221 C 420 245, 380 255, 355 267"/>
    <path d="M500 221 L 560 267"/>
    <path d="M540 221 C 640 245, 740 255, 787 267"/>
  </g>

  <!-- Teammates to data -->
  <g stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowW)">
    <path d="M150 270 L 150 505"/>
    <path d="M355 270 L 320 505"/>
    <path d="M560 270 L 495 505"/>
    <path d="M787 270 L 670 505"/>
    <path d="M820 270 L 840 505"/>
  </g>

  <!-- memory note (暖色便签风) -->
  <rect x="60" y="378" width="840" height="50" rx="12" fill="#fef3c7" stroke="#eab308" stroke-width="1.5"/>
  <text x="480" y="400" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">📌 团队记忆 TEAM_MEMORY.md（每轮自动沉淀）</text>
  <text x="480" y="418" text-anchor="middle" fill="#a16207" font-size="11">[lesson] 永辉冷链冻品常迟到2天，需备安全库存 ｜ [member] 比价 Agent 擅长生鲜 ｜ [decision] 单笔超5万走人工审批</text>
</svg>
