<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8f0"/><stop offset="100%" stop-color="#fde8d4"/></linearGradient>
    <linearGradient id="cron" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ca8a04"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/></marker>
  </defs>
  <rect width="900" height="470" fill="url(#cbg)"/>
  <text x="450" y="34" text-anchor="middle" fill="#7c2d12" font-size="20" font-weight="700">每日补货自动化：cron 定时 + 团队记忆双轮驱动</text>
  <text x="450" y="55" text-anchor="middle" fill="#9a3412" font-size="12">无人工触发，每天自动跑、自动学、越跑越准</text>

  <!-- cron block (暖黄便签) -->
  <g>
    <rect x="60" y="90" width="240" height="160" rx="18" fill="url(#cron)"/>
    <text x="180" y="120" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">cron_create_job</text>
    <text x="180" y="144" text-anchor="middle" fill="#fef3c7" font-size="11">cron_expr: 0 7 * * 1-5</text>
    <text x="180" y="162" text-anchor="middle" fill="#fef3c7" font-size="11">mode: team</text>
    <text x="180" y="180" text-anchor="middle" fill="#fef3c7" font-size="11">targets: feishu</text>
    <text x="180" y="198" text-anchor="middle" fill="#fef3c7" font-size="11">wake_offset_seconds: 30</text>
    <text x="180" y="224" text-anchor="middle" fill="#fef9c3" font-size="10">独立 session: cron_{ts}_{job_id}</text>
  </g>

  <line x1="300" y1="170" x2="345" y2="170" stroke="#9a3412" stroke-width="2" marker-end="url(#ca)"/>

  <!-- team run -->
  <g>
    <rect x="350" y="90" width="220" height="160" rx="18" fill="#fff" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="460" y="118" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">采购 Team 执行一轮</text>
    <text x="460" y="142" text-anchor="middle" fill="#7c2d12" font-size="11">取数→预测→排序→比价→下单</text>
    <text x="460" y="166" text-anchor="middle" fill="#c2410c" font-size="10">（前图 DAG 全流程）</text>
    <text x="460" y="195" text-anchor="middle" fill="#7c2d12" font-size="11">结果推送 → 飞书群</text>
    <text x="460" y="220" text-anchor="middle" fill="#9a3412" font-size="10">采购单 + 异常预警</text>
  </g>

  <line x1="570" y1="170" x2="615" y2="170" stroke="#9a3412" stroke-width="2" marker-end="url(#ca)"/>

  <!-- extractor -->
  <g>
    <rect x="620" y="90" width="220" height="160" rx="18" fill="url(#ext)"/>
    <text x="730" y="120" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Leader 派提取 Agent</text>
    <text x="730" y="144" text-anchor="middle" fill="#ffedd5" font-size="11">读取本轮任务记录+消息</text>
    <text x="730" y="162" text-anchor="middle" fill="#ffedd5" font-size="11">蒸馏值得保留的经验</text>
    <text x="730" y="186" text-anchor="middle" fill="#ffedd5" font-size="11">合并/更新/淘汰条目</text>
    <text x="730" y="214" text-anchor="middle" fill="#ffedd5" font-size="10">写入 TEAM_MEMORY.md</text>
    <text x="730" y="232" text-anchor="middle" fill="#ffedd5" font-size="10">保持 &lt; 200 行</text>
  </g>

  <!-- feedback loop -->
  <path d="M730 250 C 730 320, 460 340, 460 250" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca)"/>
  <text x="595" y="345" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="600">次日 7:00 读记忆再跑（经验反哺预测/比价）</text>

  <!-- memory tags (便签风) -->
  <rect x="60" y="380" width="780" height="68" rx="14" fill="#fef3c7" stroke="#eab308" stroke-width="1.5"/>
  <text x="450" y="404" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">📌 TEAM_MEMORY.md 四类标签（跨轮累积，所有成员只读）</text>
  <g font-size="11">
    <text x="90" y="430" fill="#dc2626" font-weight="600">[lesson]</text><text x="150" y="430" fill="#7c2d12">永辉冷链冻品迟到2天→备安全库存</text>
    <text x="450" y="430" fill="#ca8a04" font-weight="600">[member]</text><text x="510" y="430" fill="#7c2d12">比价Agent擅长生鲜议价</text>
  </g>
</svg>
