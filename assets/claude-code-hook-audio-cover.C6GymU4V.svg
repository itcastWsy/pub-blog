<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code hooks audio notification cover</title>
  <desc id="desc">A terminal window connected to an audio waveform, illustrating a Claude Code task completion sound hook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10241f"/>
      <stop offset="0.55" stop-color="#172c35"/>
      <stop offset="1" stop-color="#382c1d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182d2b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#d8f3dc" stroke-width="1">
    <path d="M80 520 C260 400 360 610 540 470 S840 310 1110 430" fill="none"/>
    <path d="M70 145 C250 245 380 60 560 155 S830 290 1110 145" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="110" y="105" width="650" height="420" rx="24" fill="url(#panel)" stroke="#77c7a8" stroke-opacity="0.42"/>
    <rect x="110" y="105" width="650" height="58" rx="24" fill="#203a37"/>
    <circle cx="150" cy="135" r="8" fill="#ff6b6b"/>
    <circle cx="178" cy="135" r="8" fill="#ffd166"/>
    <circle cx="206" cy="135" r="8" fill="#6ee7b7"/>
    <text x="145" y="218" fill="#e5f7ef" font-family="Consolas, Menlo, monospace" font-size="30">~/.claude/settings.json</text>
    <text x="145" y="272" fill="#9ae6b4" font-family="Consolas, Menlo, monospace" font-size="26">"hooks": {</text>
    <text x="175" y="318" fill="#f6e7c1" font-family="Consolas, Menlo, monospace" font-size="26">"Stop": [</text>
    <text x="205" y="364" fill="#8bd3ff" font-family="Consolas, Menlo, monospace" font-size="26">"PlaySync()"</text>
    <text x="175" y="410" fill="#f6e7c1" font-family="Consolas, Menlo, monospace" font-size="26">]</text>
    <text x="145" y="456" fill="#9ae6b4" font-family="Consolas, Menlo, monospace" font-size="26">}</text>
  </g>

  <g transform="translate(830 175)">
    <circle cx="130" cy="140" r="116" fill="#f4d35e" opacity="0.95"/>
    <path d="M78 135 h42 l64 -48 v154 l-64 -48 H78 z" fill="#17232b"/>
    <path d="M210 101 C242 124 242 184 210 207" fill="none" stroke="#17232b" stroke-width="18" stroke-linecap="round"/>
    <path d="M246 64 C300 106 300 224 246 266" fill="none" stroke="#17232b" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  </g>

  <text x="110" y="590" fill="#f7fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Claude Code 任务结束会自己喊你</text>
  <text x="792" y="98" fill="#d8f3dc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Stop Hook -> 音频提醒</text>
</svg>
