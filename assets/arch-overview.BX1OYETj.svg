<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Georgia','Microsoft YaHei',serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a5f"/></marker>
  </defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="560" fill="#1e3a5f"/>
  <text x="480" y="38" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">合同智能审查与风险追踪 · 总体架构</text>
  <text x="480" y="60" text-anchor="middle" fill="#475569" font-size="12">关键条款识别 · 风险标注 · 修改建议</text>

  <!-- Layer 1: 文档输入 (细线表格风) -->
  <rect x="40" y="440" width="880" height="100" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="463" fill="#475569" font-size="12" font-weight="600">合同文档输入层</text>
  <g font-size="12" fill="#1e293b">
    <rect x="70" y="478" width="170" height="50" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="155" y="500" text-anchor="middle" font-weight="600">合同 PDF / 扫描件</text>
    <text x="155" y="517" text-anchor="middle" fill="#64748b" font-size="10">pdfplumber + OCR</text>

    <rect x="265" y="478" width="170" height="50" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="350" y="500" text-anchor="middle" font-weight="600">Word / 协作稿</text>
    <text x="350" y="517" text-anchor="middle" fill="#64748b" font-size="10">read_file 解析</text>

    <rect x="460" y="478" width="170" height="50" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="545" y="500" text-anchor="middle" font-weight="600">历史条款库</text>
    <text x="545" y="517" text-anchor="middle" fill="#64748b" font-size="10">TEAM_MEMORY / wiki</text>

    <rect x="655" y="478" width="225" height="50" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="767" y="500" text-anchor="middle" font-weight="600">法规库 / 行业范本</text>
    <text x="767" y="517" text-anchor="middle" fill="#64748b" font-size="10">mcp_paid_search 检索</text>
  </g>

  <!-- Layer 2: 协作层 -->
  <rect x="40" y="80" width="880" height="340" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="104" fill="#475569" font-size="12" font-weight="600">蜂群协作层 · 合同审查 Team（条款记忆 + 并行评审 + 修改建议生成）</text>

  <!-- Leader (藏青实色，无渐变，克制) -->
  <rect x="360" y="125" width="240" height="84" rx="2" fill="#1e3a5f" stroke="#0f172a" stroke-width="1.5"/>
  <text x="480" y="152" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Leader · 审查协调官</text>
  <text x="480" y="174" text-anchor="middle" fill="#cbd5e1" font-size="11">解析合同 → 分发条款 → 汇总风险</text>
  <text x="480" y="191" text-anchor="middle" fill="#cbd5e1" font-size="11">整合修改建议 · 高风险人工复核</text>

  <!-- Teammates (灰蓝描边，无填充渐变) -->
  <g font-size="12">
    <rect x="60" y="260" width="195" height="80" rx="2" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="157" y="287" text-anchor="middle" fill="#1e3a5f" font-weight="700">条款提取 Agent</text>
    <text x="157" y="306" text-anchor="middle" fill="#475569" font-size="10">结构化抽取关键条款</text>
    <text x="157" y="322" text-anchor="middle" fill="#475569" font-size="10">付款/违约/知识产权/保密…</text>

    <rect x="275" y="260" width="195" height="80" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="372" y="287" text-anchor="middle" fill="#991b1b" font-weight="700">风险标注 Agent</text>
    <text x="372" y="306" text-anchor="middle" fill="#7f1d1d" font-size="10">对照条款库 + 法规</text>
    <text x="372" y="322" text-anchor="middle" fill="#7f1d1d" font-size="10">高/中/低风险分级标注</text>

    <rect x="490" y="260" width="195" height="80" rx="2" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="587" y="287" text-anchor="middle" fill="#1e3a5f" font-weight="700">合规校验 Agent</text>
    <text x="587" y="306" text-anchor="middle" fill="#475569" font-size="10">数据合规/反垄断/行业</text>
    <text x="587" y="322" text-anchor="middle" fill="#475569" font-size="10">监管红线检查</text>

    <rect x="705" y="260" width="195" height="80" rx="2" fill="#f0f9ff" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="802" y="287" text-anchor="middle" fill="#1e3a5f" font-weight="700">修改建议 Agent</text>
    <text x="802" y="306" text-anchor="middle" fill="#475569" font-size="10">生成条款级修改文本</text>
    <text x="802" y="322" text-anchor="middle" fill="#475569" font-size="10">引用历史判例/范本</text>
  </g>

  <!-- Leader -> Teammates -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M420 209 C 300 235, 220 245, 160 257"/>
    <path d="M450 209 C 410 235, 380 245, 370 257"/>
    <path d="M510 209 C 550 235, 580 245, 585 257"/>
    <path d="M540 209 C 640 235, 740 245, 800 257"/>
  </g>

  <g stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowW)">
    <path d="M157 260 L 155 475"/>
    <path d="M372 260 L 350 475"/>
    <path d="M587 260 L 545 475"/>
    <path d="M802 260 L 767 475"/>
  </g>

  <!-- memory (细线框，法律文档感) -->
  <rect x="60" y="370" width="840" height="40" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="480" y="395" text-anchor="middle" fill="#334155" font-size="11">TEAM_MEMORY.md：[decision] 责任上限取合同额1倍 ｜ [lesson] 某甲方模板付款条件偏苛刻 ｜ [context] 本行业数据合规强监管</text>
</svg>
