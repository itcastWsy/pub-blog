<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="d_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nodeT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="url(#d_bg)"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">设备依赖编排：Swarmflow DAG 示例</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">一次“电机壳体装配+检测”任务的依赖图</text>

  <!-- Legend -->
  <g font-size="11">
    <rect x="40" y="78" width="14" height="14" rx="3" fill="url(#nodeL)"/><text x="62" y="90" fill="#cbd5e1">Leader 节点</text>
    <rect x="160" y="78" width="14" height="14" rx="3" fill="url(#nodeT)"/><text x="182" y="90" fill="#cbd5e1">Team 任务节点</text>
    <rect x="300" y="78" width="14" height="14" rx="3" fill="url(#nodeA)"/><text x="322" y="90" fill="#cbd5e1">外部 A2A 节点</text>
    <line x1="440" y1="86" x2="480" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#da)"/><text x="488" y="90" fill="#cbd5e1">依赖（串行/前置）</text>
    <line x1="640" y1="86" x2="680" y2="86" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#da2)"/><text x="688" y="90" fill="#cbd5e1">条件分支 / 人工审批</text>
  </g>

  <!-- Nodes -->
  <!-- T0 start -->
  <g>
    <rect x="395" y="120" width="110" height="50" rx="8" fill="url(#nodeL)"/>
    <text x="450" y="143" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">T0 启动批次</text>
    <text x="450" y="160" text-anchor="middle" fill="#ede9fe" font-size="10">Leader 派发</text>
  </g>

  <!-- T1 物料到货 (A2A) -->
  <g>
    <rect x="110" y="215" width="160" height="60" rx="9" fill="url(#nodeA)"/>
    <text x="190" y="240" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T1 物料到货校验</text>
    <text x="190" y="258" text-anchor="middle" fill="#0b1220" font-size="10">供应商 Agent · A2A</text>
  </g>

  <!-- T2 夹具就位 -->
  <g>
    <rect x="395" y="215" width="110" height="60" rx="9" fill="url(#nodeT)"/>
    <text x="450" y="240" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T2 夹具就位</text>
    <text x="450" y="258" text-anchor="middle" fill="#0b1220" font-size="10">PLC Skill</text>
  </g>

  <!-- T3 机械臂取料 -->
  <g>
    <rect x="630" y="215" width="160" height="60" rx="9" fill="url(#nodeT)"/>
    <text x="710" y="240" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T3 机械臂取料</text>
    <text x="710" y="258" text-anchor="middle" fill="#0b1220" font-size="10">ABB · OPC-UA</text>
  </g>

  <!-- T4 CNC 加工 -->
  <g>
    <rect x="395" y="320" width="110" height="60" rx="9" fill="url(#nodeT)"/>
    <text x="450" y="345" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T4 CNC 加工</text>
    <text x="450" y="363" text-anchor="middle" fill="#0b1220" font-size="10">MTConnect</text>
  </g>

  <!-- T5 视觉质检 -->
  <g>
    <rect x="630" y="320" width="160" height="60" rx="9" fill="url(#nodeT)"/>
    <text x="710" y="345" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T5 视觉质检</text>
    <text x="710" y="363" text-anchor="middle" fill="#0b1220" font-size="10">gRPC · Vision Skill</text>
  </g>

  <!-- H1 人工审批 (条件) -->
  <g>
    <rect x="395" y="420" width="110" height="56" rx="9" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="450" y="444" text-anchor="middle" fill="#f43f5e" font-size="13" font-weight="700">H1 质检复核</text>
    <text x="450" y="461" text-anchor="middle" fill="#fca5a5" font-size="10">人工算子（有状态）</text>
  </g>

  <!-- T6 AGV 入库 -->
  <g>
    <rect x="630" y="420" width="160" height="56" rx="9" fill="url(#nodeT)"/>
    <text x="710" y="444" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">T6 AGV 入库</text>
    <text x="710" y="461" text-anchor="middle" fill="#0b1220" font-size="10">MQTT · 路径规划</text>
  </g>

  <!-- Edges -->
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#da)">
    <path d="M410 170 C 300 180, 220 195, 200 212"/>
    <path d="M450 170 L 450 212"/>
    <path d="M490 170 C 600 180, 680 195, 700 212"/>
    <path d="M250 270 C 320 290, 380 300, 410 318"/>
    <path d="M450 275 L 450 318"/>
    <path d="M710 275 L 710 318"/>
    <path d="M505 350 C 600 350, 650 340, 680 340"/>
    <path d="M710 380 L 710 418"/>
  </g>
  <!-- Conditional edge -->
  <g fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#da2)">
    <path d="M505 350 C 480 380, 470 400, 460 418"/>
  </g>

  <!-- Notes -->
  <text x="60" y="500" fill="#64748b" font-size="11">▸ T1 与 T2/T3 并行启动；T4 需 T2、T3 都完成；T5 完成后触发条件分支。</text>
  <text x="60" y="518" fill="#64748b" font-size="11">▸ T5 判定“疑似不良” → 进入 H1 人工算子；复核通过 → 继续 T6 入库，复核拒绝 → Leader 重派 T4。</text>
</svg>
