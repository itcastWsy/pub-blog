<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8f0"/><stop offset="100%" stop-color="#fde8d4"/></linearGradient>
    <linearGradient id="nodeL" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="nodeT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/></marker>
    <marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/></marker>
  </defs>
  <rect width="900" height="520" fill="url(#dbg)"/>
  <text x="450" y="34" text-anchor="middle" fill="#7c2d12" font-size="20" font-weight="700">食材依赖编排：每日补货 Swarmflow DAG</text>
  <text x="450" y="55" text-anchor="middle" fill="#9a3412" font-size="12">cron 7:00 唤醒 → 多门店并行取数 → 依赖排序 → 比价 → 下单</text>

  <g font-size="11">
    <rect x="40" y="74" width="14" height="14" rx="4" fill="url(#nodeL)"/><text x="62" y="86" fill="#7c2d12">Leader 节点</text>
    <rect x="160" y="74" width="14" height="14" rx="4" fill="url(#nodeT)"/><text x="182" y="86" fill="#7c2d12">Team 任务节点</text>
    <rect x="310" y="74" width="14" height="14" rx="4" fill="url(#nodeA)"/><text x="332" y="86" fill="#7c2d12">下单/外部</text>
    <line x1="450" y1="82" x2="490" y2="82" stroke="#9a3412" stroke-width="2" marker-end="url(#da)"/><text x="498" y="86" fill="#7c2d12">依赖（前置）</text>
    <line x1="630" y1="82" x2="670" y2="82" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#da2)"/><text x="678" y="86" fill="#7c2d12">条件/人工审批</text>
  </g>

  <!-- T0 -->
  <g><rect x="395" y="110" width="110" height="46" rx="14" fill="url(#nodeL)"/>
    <text x="450" y="131" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T0 cron 唤醒</text>
    <text x="450" y="147" text-anchor="middle" fill="#ffedd5" font-size="10">每日 07:00</text></g>

  <!-- T1 -->
  <g><rect x="80" y="195" width="200" height="56" rx="16" fill="url(#nodeT)"/>
    <text x="180" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T1 各门店库存/销量取数</text>
    <text x="180" y="236" text-anchor="middle" fill="#fecaca" font-size="10">map_parallel · 4 门店</text></g>

  <!-- T2 -->
  <g><rect x="350" y="195" width="200" height="56" rx="16" fill="url(#nodeT)"/>
    <text x="450" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T2 需求预测</text>
    <text x="450" y="236" text-anchor="middle" fill="#fecaca" font-size="10">POS+天气 → SKU 需求</text></g>

  <!-- T3 -->
  <g><rect x="620" y="195" width="200" height="56" rx="16" fill="url(#nodeT)"/>
    <text x="720" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T3 缺口 + 依赖排序</text>
    <text x="720" y="236" text-anchor="middle" fill="#fecaca" font-size="10">BOM 替代/冷链优先级</text></g>

  <!-- T4 -->
  <g><rect x="350" y="295" width="200" height="56" rx="16" fill="url(#nodeT)"/>
    <text x="450" y="318" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T4 供应商比价</text>
    <text x="450" y="336" text-anchor="middle" fill="#fecaca" font-size="10">A2A / paid_search</text></g>

  <!-- H1 -->
  <g><rect x="350" y="385" width="200" height="54" rx="16" fill="#fff" stroke="#991b1b" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="450" y="408" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">H1 超预算审批</text>
    <text x="450" y="425" text-anchor="middle" fill="#b91c1c" font-size="10">单笔 > 5万 · 人工算子</text></g>

  <!-- T5 -->
  <g><rect x="620" y="385" width="200" height="54" rx="16" fill="url(#nodeA)"/>
    <text x="720" y="408" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T5 生成采购单</text>
    <text x="720" y="425" text-anchor="middle" fill="#fde68a" font-size="10">ERP / A2A 下单</text></g>

  <g fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#da)">
    <path d="M410 156 C 300 170, 220 180, 195 192"/>
    <path d="M450 156 L 450 192"/>
    <path d="M490 156 C 600 170, 680 180, 710 192"/>
    <path d="M280 250 C 320 270, 360 280, 400 292"/>
    <path d="M500 250 C 580 270, 640 280, 680 292"/>
    <path d="M450 351 L 450 383"/>
    <path d="M500 412 L 618 412"/>
  </g>
  <g fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#da2)">
    <path d="M400 412 C 300 412, 220 350, 180 255"/>
  </g>

  <text x="60" y="478" fill="#9a3412" font-size="11">▸ T1 四门店并行取数（map_parallel）；T3 依赖排序后 T4 比价；总金额超阈值走 H1 人工审批，驳回则 Leader 重派 T2。</text>
  <text x="60" y="498" fill="#9a3412" font-size="11">▸ 全程由 cron 唤醒，结果推送到飞书/企微；本轮"供应商迟到"等经验写入 TEAM_MEMORY.md 供次日参考。</text>
</svg>
