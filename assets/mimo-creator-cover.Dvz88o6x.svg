      .h2 { font: 600 28px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .tag { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
      .card-title { font: 700 24px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .card-sub { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .small { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="150" fill="#bfdbfe" opacity="0.45"/>
  <circle cx="106" cy="526" r="180" fill="#fed7aa" opacity="0.42"/>
  <path d="M70 452 C210 365 360 520 520 430 S820 340 1110 460" fill="none" stroke="#dbeafe" stroke-width="3"/>

  <g transform="translate(74 92)">
    <rect x="0" y="0" width="164" height="38" rx="19" fill="url(#orange)"/>
    <text x="25" y="26" class="tag">MiMo-V2.5</text>
    <text x="0" y="102" class="h1">小米 MiMo 发福利了？</text>
    <text x="0" y="174" class="h1">AI 视频创作者该动手了</text>
    <text x="0" y="228" class="h2">Codex 写脚本 · HyperFrames 出画面 · MiMo TTS 配音</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="118" width="360" height="260" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="765" y="148" width="300" height="166" rx="18" fill="#0f172a"/>
    <polygon points="888,190 888,272 958,231" fill="#38bdf8"/>
    <rect x="790" y="336" width="80" height="12" rx="6" fill="#bfdbfe"/>
    <rect x="890" y="336" width="150" height="12" rx="6" fill="#fed7aa"/>
  </g>

  <g filter="url(#shadow)">
