    <text x="126" y="449" class="card-title">最高降价 99%</text>
    <text x="126" y="482" class="card-sub">让反复试错更便宜</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="384" y="404" width="260" height="112" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="416" y="449" class="card-title">TTS 限时免费</text>
    <text x="416" y="482" class="card-sub">旁白、音色、字幕更顺手</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="674" y="404" width="260" height="112" rx="22" fill="#ffffff" stroke="#fed7aa"/>
    <text x="706" y="449" class="card-title">视频流水线</text>
    <text x="706" y="482" class="card-sub">一个人也能做系列教程</text>
