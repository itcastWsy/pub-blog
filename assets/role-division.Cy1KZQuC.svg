<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="L" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="T" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#rbg)"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Agent Team 角色分工：Leader 统筹 / Teammate 专业执行</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">分级自主协同 + 双层团队记忆（个人记忆 / TEAM_MEMORY.md）</text>

  <!-- Leader center -->
  <g>
    <rect x="360" y="190" width="180" height="110" rx="12" fill="url(#L)"/>
    <text x="450" y="220" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Leader</text>
    <text x="450" y="240" text-anchor="middle" fill="#ede9fe" font-size="12">产线调度官</text>
    <text x="450" y="262" text-anchor="middle" fill="#ede9fe" font-size="11">·目标理解 ·团队组建</text>
    <text x="450" y="278" text-anchor="middle" fill="#ede9fe" font-size="11">·DAG编排 ·关键决策</text>
    <text x="450" y="294" text-anchor="middle" fill="#ede9fe" font-size="11">·团队记忆提取/汇总</text>
  </g>

  <!-- Teammates around -->
  <g font-size="12">
    <!-- left -->
    <rect x="60" y="100" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="145" y="128" text-anchor="middle" fill="#0b1220" font-weight="700">机械臂 Agent</text>
    <text x="145" y="148" text-anchor="middle" fill="#0b1220" font-size="11">认领→独立执行→汇报</text>
    <text x="145" y="166" text-anchor="middle" fill="#0b1220" font-size="11">困难时向 Leader 求助</text>

    <rect x="60" y="220" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="145" y="248" text-anchor="middle" fill="#0b1220" font-weight="700">CNC 加工 Agent</text>
    <text x="145" y="268" text-anchor="middle" fill="#0b1220" font-size="11">加工参数 / G代码下发</text>
    <text x="145" y="286" text-anchor="middle" fill="#0b1220" font-size="11">提交中间产物</text>

    <rect x="60" y="340" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="145" y="368" text-anchor="middle" fill="#0b1220" font-weight="700">AGV 物流 Agent</text>
    <text x="145" y="388" text-anchor="middle" fill="#0b1220" font-size="11">路径规划 / 取货入库</text>
    <text x="145" y="406" text-anchor="middle" fill="#0b1220" font-size="11">MQTT 异步事件驱动</text>

    <!-- right -->
    <rect x="670" y="100" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="755" y="128" text-anchor="middle" fill="#0b1220" font-weight="700">视觉质检 Agent</text>
    <text x="755" y="148" text-anchor="middle" fill="#0b1220" font-size="11">缺陷识别 / 判定</text>
    <text x="755" y="166" text-anchor="middle" fill="#0b1220" font-size="11">疑似不良→触发条件分支</text>

    <rect x="670" y="220" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="755" y="248" text-anchor="middle" fill="#0b1220" font-weight="700">能耗优化 Agent</text>
    <text x="755" y="268" text-anchor="middle" fill="#0b1220" font-size="11">峰谷调度 / 待机降耗</text>
    <text x="755" y="286" text-anchor="middle" fill="#0b1220" font-size="11">实时电力数据监控</text>

    <rect x="670" y="340" width="170" height="80" rx="10" fill="url(#T)"/>
    <text x="755" y="368" text-anchor="middle" fill="#0b1220" font-weight="700">供应商协同 Agent</text>
    <text x="755" y="388" text-anchor="middle" fill="#0b1220" font-size="11">A2A / 外部 Agent</text>
    <text x="755" y="406" text-anchor="middle" fill="#0b1220" font-size="11">物料到货预警</text>
  </g>

  <!-- bidirectional lines -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ra)">
    <path d="M230 140 C 320 160, 340 200, 360 215"/>
    <path d="M230 260 L 360 245"/>
    <path d="M230 380 C 320 360, 340 320, 360 290"/>
    <path d="M670 140 C 580 160, 560 200, 540 215"/>
    <path d="M670 260 L 540 245"/>
    <path d="M670 380 C 580 360, 560 320, 540 290"/>
  </g>

  <!-- memory note -->
  <rect x="320" y="430" width="260" height="46" rx="10" fill="#020617" stroke="#a855f7"/>
  <text x="450" y="452" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">双层记忆：个人记忆(独立读写) + TEAM_MEMORY.md(只读·Leader写入)</text>
  <text x="450" y="468" text-anchor="middle" fill="#64748b" font-size="11">跨 round 累积：[decision]/[lesson]/[member]/[context]</text>
</svg>
