<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#e8eeff"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg1)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d3748">AI Coding 编程范式演进</text>

  <!-- Timeline line -->
  <line x1="100" y1="155" x2="800" y2="155" stroke="#cbd5e0" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Arrow markers -->
  <polygon points="790,148 810,155 790,162" fill="#cbd5e0"/>

  <!-- Stage 1: Copilot -->
  <g filter="url(#shadow1)">
    <rect x="40" y="80" width="220" height="150" rx="12" fill="white" stroke="url(#g1)" stroke-width="2"/>
  </g>
  <rect x="40" y="80" width="220" height="45" rx="12" fill="url(#g1)"/>
  <rect x="40" y="105" width="220" height="20" fill="url(#g1)"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Copilot</text>
  <text x="150" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4a5568" font-weight="bold">人绝对主导，AI 辅助</text>
  <text x="150" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">人主动输入 → AI 返回信息</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">如：豆包、ChatGPT 网页版</text>
  <circle cx="150" cy="155" r="5" fill="#667eea" opacity="0"/>
  <!-- Timeline dot -->
  <circle cx="150" cy="155" r="8" fill="#667eea" stroke="white" stroke-width="3"/>

  <!-- Stage 2: Vibe Coding -->
  <g filter="url(#shadow1)">
    <rect x="340" y="80" width="220" height="150" rx="12" fill="white" stroke="url(#g2)" stroke-width="2"/>
  </g>
  <rect x="340" y="80" width="220" height="45" rx="12" fill="url(#g2)"/>
  <rect x="340" y="105" width="220" height="20" fill="url(#g2)"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Vibe Coding</text>
  <text x="450" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4a5568" font-weight="bold">意图驱动，协同开发</text>
  <text x="450" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">人描述意图 → AI 执行 → 人审核</text>
  <text x="450" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">如：Cursor、Trae 等 AI IDE</text>
  <circle cx="450" cy="155" r="8" fill="#f5576c" stroke="white" stroke-width="3"/>

  <!-- Stage 3: Agentic -->
  <g filter="url(#shadow1)">
    <rect x="640" y="80" width="220" height="150" rx="12" fill="white" stroke="url(#g3)" stroke-width="2"/>
  </g>
  <rect x="640" y="80" width="220" height="45" rx="12" fill="url(#g3)"/>
  <rect x="640" y="105" width="220" height="20" fill="url(#g3)"/>
  <text x="750" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Agentic</text>
  <text x="750" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4a5568" font-weight="bold">目标驱动，智能体自主开发</text>
  <text x="750" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">人定目标 → AI 规划+执行</text>
  <text x="750" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">如：DevEco Code、Claude Code</text>
  <circle cx="750" cy="155" r="8" fill="#00c6fb" stroke="white" stroke-width="3"/>

  <!-- Arrows between stages -->
  <path d="M270 155 L325 155" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M570 155 L625 155" stroke="#a0aec0" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- Bottom labels -->
  <text x="150" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0">人的参与度：高</text>
  <text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0">人的参与度：中</text>
  <text x="750" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0">人的参与度：低（仅关键节点）</text>

  <!-- Progress bar -->
  <rect x="100" y="285" width="700" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="100" y="285" width="700" height="6" rx="3" fill="url(#g1)" opacity="0.3"/>
  <text x="100" y="305" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">AI 自主程度</text>
  <text x="770" y="305" font-family="Arial, sans-serif" font-size="11" fill="#4facfe" font-weight="bold">越来越高 →</text>
</svg>