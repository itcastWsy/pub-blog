<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Georgia','Microsoft YaHei',serif">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/></marker>
  </defs>
  <rect width="900" height="540" fill="url(#dbg)"/>
  <rect x="0" y="0" width="6" height="540" fill="#1e3a5f"/>
  <text x="450" y="34" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">合同审查 Swarmflow：解析 → 并行评审 → 汇总 → 建议</text>
  <text x="450" y="55" text-anchor="middle" fill="#475569" font-size="12">关键条款并行识别 · 风险标注 · 高风险触发人工复核</text>

  <g font-size="11">
    <rect x="40" y="74" width="14" height="14" rx="2" fill="#1e3a5f"/><text x="62" y="86" fill="#334155">Leader</text>
    <rect x="120" y="74" width="14" height="14" rx="2" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="142" y="86" fill="#334155">并行评审</text>
    <rect x="230" y="74" width="14" height="14" rx="2" fill="#f0f9ff" stroke="#1e3a5f" stroke-width="1.5"/><text x="252" y="86" fill="#334155">产出建议</text>
    <line x1="360" y1="82" x2="400" y2="82" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#da2)"/><text x="408" y="86" fill="#334155">高风险→人工复核</text>
  </g>

  <!-- T0 -->
  <g><rect x="370" y="105" width="160" height="48" rx="2" fill="#1e3a5f"/>
    <text x="450" y="127" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">T0 合同解析</text>
    <text x="450" y="143" text-anchor="middle" fill="#cbd5e1" font-size="10">pdfplumber/OCR 抽全文</text></g>

  <!-- T1 并行评审 (虚线分组框，文档批注感) -->
  <g><rect x="80" y="195" width="740" height="90" rx="2" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="100" y="214" fill="#475569" font-size="11" font-weight="600">parallel（三路并行评审）</text>
    <g>
      <rect x="100" y="224" width="210" height="50" rx="2" fill="#fff" stroke="#475569" stroke-width="1.5"/>
      <text x="205" y="246" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">T1a 条款提取</text>
      <text x="205" y="263" text-anchor="middle" fill="#64748b" font-size="10">付款/违约/IP/保密…</text>
    </g>
    <g>
      <rect x="345" y="224" width="210" height="50" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
      <text x="450" y="246" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">T1b 风险标注</text>
      <text x="450" y="263" text-anchor="middle" fill="#7f1d1d" font-size="10">对照条款库+法规分级</text>
    </g>
    <g>
      <rect x="590" y="224" width="210" height="50" rx="2" fill="#fff" stroke="#475569" stroke-width="1.5"/>
      <text x="695" y="246" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">T1c 合规校验</text>
      <text x="695" y="263" text-anchor="middle" fill="#64748b" font-size="10">数据/反垄断/行业红线</text>
    </g>
  </g>

  <!-- T2 -->
  <g><rect x="370" y="320" width="160" height="48" rx="2" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="450" y="342" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">T2 风险汇总</text>
    <text x="450" y="358" text-anchor="middle" fill="#475569" font-size="10">合并三路 · 排序定级</text></g>

  <!-- H1 -->
  <g><rect x="150" y="410" width="180" height="50" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="240" y="432" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">H1 高风险人工复核</text>
    <text x="240" y="449" text-anchor="middle" fill="#b91c1c" font-size="10">CRITICAL 条款 · 律师</text></g>

  <!-- T3 -->
  <g><rect x="570" y="410" width="180" height="50" rx="2" fill="#f0f9ff" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="660" y="432" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">T3 生成修改建议</text>
    <text x="660" y="449" text-anchor="middle" fill="#475569" font-size="10">条款级改写 + 引据</text></g>

  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#da)">
    <path d="M450 153 L 450 192"/>
    <path d="M450 285 L 450 318"/>
    <path d="M420 368 C 350 390, 290 400, 250 408"/>
    <path d="M480 368 C 550 390, 610 400, 650 408"/>
    <path d="M330 435 C 430 435, 540 435, 568 435"/>
  </g>
  <g fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#da2)">
    <path d="M400 360 C 320 360, 240 320, 240 285"/>
  </g>

  <text x="60" y="498" fill="#475569" font-size="11">▸ T0 解析后，T1a/T1b/T1c 三路并行评审（条款提取、风险标注、合规校验同时跑）；T2 汇总后高风险条款走 H1 律师复核。</text>
  <text x="60" y="518" fill="#475569" font-size="11">▸ 复核通过/修改后进入 T3 生成条款级修改建议；本轮新发现的"坑"（如苛刻付款条件）写入条款库 TEAM_MEMORY.md 供后续合同参考。</text>
</svg>
