<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="leader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sym" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="620" fill="url(#bg)"/>
  <text x="480" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">JiuwenSwarm 智能制造产线协作 · 总体架构</text>
  <text x="480" y="60" text-anchor="middle" fill="#64748b" font-size="13">设备依赖编排 · 角色分工 · 异构通信安全</text>

  <!-- Layer 1: 产线物理层 -->
  <rect x="40" y="470" width="880" height="120" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="495" fill="#64748b" font-size="12">物理产线层（异构设备 / 异构协议）</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="60" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="120" y="535" text-anchor="middle">机械臂 ABB</text>
    <text x="120" y="553" text-anchor="middle" fill="#64748b" font-size="10">OPC-UA / Modbus</text>

    <rect x="200" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="260" y="535" text-anchor="middle">CNC 机床</text>
    <text x="260" y="553" text-anchor="middle" fill="#64748b" font-size="10">MTConnect</text>

    <rect x="340" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="400" y="535" text-anchor="middle">AGV 搬运车</text>
    <text x="400" y="553" text-anchor="middle" fill="#64748b" font-size="10">MQTT</text>

    <rect x="480" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="540" y="535" text-anchor="middle">视觉检测相机</text>
    <text x="540" y="553" text-anchor="middle" fill="#64748b" font-size="10">gRPC / REST</text>

    <rect x="620" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="680" y="535" text-anchor="middle">PLC 控制柜</text>
    <text x="680" y="553" text-anchor="middle" fill="#64748b" font-size="10">EtherCAT</text>

    <rect x="760" y="510" width="120" height="60" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="820" y="535" text-anchor="middle">外部供应商 Agent</text>
    <text x="820" y="553" text-anchor="middle" fill="#64748b" font-size="10">A2A 协议</text>
  </g>

  <!-- Layer 2: 协议适配 / A2A 网关 -->
  <rect x="40" y="350" width="880" height="95" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="373" fill="#64748b" font-size="12">异构通信适配层 · Gateway A2A Channel</text>
  <g font-size="13" fill="#e2e8f0">
    <rect x="80" y="390" width="150" height="42" rx="21" fill="url(#sym)"/>
    <text x="155" y="416" text-anchor="middle" fill="#0b1220" font-weight="700">A2A Server</text>

    <rect x="250" y="390" width="150" height="42" rx="21" fill="#020617" stroke="#22d3ee"/>
    <text x="325" y="416" text-anchor="middle" fill="#22d3ee">Skill 适配器组</text>

    <rect x="420" y="390" width="150" height="42" rx="21" fill="#020617" stroke="#22d3ee"/>
    <text x="495" y="416" text-anchor="middle" fill="#22d3ee">消息编解码 (E2A)</text>

    <rect x="590" y="390" width="150" height="42" rx="21" fill="#020617" stroke="#22d3ee"/>
    <text x="665" y="416" text-anchor="middle" fill="#22d3ee">任务/事件路由</text>

    <rect x="760" y="390" width="120" height="42" rx="21" fill="#020617" stroke="#f43f5e"/>
    <text x="820" y="416" text-anchor="middle" fill="#f43f5e">权限/审批</text>
  </g>

  <!-- Layer 3: Agent Team -->
  <rect x="40" y="90" width="880" height="240" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="113" fill="#64748b" font-size="12">蜂群协作层 · Agent Team（Swarmflow 编排 + 团队记忆）</text>

  <!-- Leader -->
  <g filter="url(#glow)">
    <rect x="380" y="130" width="200" height="80" rx="10" fill="url(#leader)"/>
    <text x="480" y="158" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Leader · 产线调度官</text>
    <text x="480" y="180" text-anchor="middle" fill="#ede9fe" font-size="11">任务拆解 / DAG 依赖编排</text>
    <text x="480" y="196" text-anchor="middle" fill="#ede9fe" font-size="11">团队记忆提取 · 关键决策</text>
  </g>

  <!-- Teammates -->
  <g>
    <rect x="60" y="240" width="150" height="70" rx="9" fill="url(#tm)"/>
    <text x="135" y="266" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">机械臂控制 Agent</text>
    <text x="135" y="285" text-anchor="middle" fill="#0b1220" font-size="10">OPC-UA Skill</text>
    <text x="135" y="299" text-anchor="middle" fill="#0b1220" font-size="10">归位/取放/急停</text>

    <rect x="225" y="240" width="150" height="70" rx="9" fill="url(#tm)"/>
    <text x="300" y="266" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">CNC 加工 Agent</text>
    <text x="300" y="285" text-anchor="middle" fill="#0b1220" font-size="10">MTConnect Skill</text>
    <text x="300" y="299" text-anchor="middle" fill="#0b1220" font-size="10">G 代码 / 主轴参数</text>

    <rect x="390" y="240" width="150" height="70" rx="9" fill="url(#tm)"/>
    <text x="465" y="266" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">AGV 物流 Agent</text>
    <text x="465" y="285" text-anchor="middle" fill="#0b1220" font-size="10">MQTT Skill</text>
    <text x="465" y="299" text-anchor="middle" fill="#0b1220" font-size="10">路径规划 / 取货</text>

    <rect x="555" y="240" width="150" height="70" rx="9" fill="url(#tm)"/>
    <text x="630" y="266" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">质检视觉 Agent</text>
    <text x="630" y="285" text-anchor="middle" fill="#0b1220" font-size="10">gRPC + Vision Skill</text>
    <text x="630" y="299" text-anchor="middle" fill="#0b1220" font-size="10">缺陷识别 / 判定</text>

    <rect x="720" y="240" width="180" height="70" rx="9" fill="url(#dev)"/>
    <text x="810" y="266" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">供应商协同 Agent</text>
    <text x="810" y="285" text-anchor="middle" fill="#0b1220" font-size="10">A2A MCP / 外部 Agent</text>
    <text x="810" y="299" text-anchor="middle" fill="#0b1220" font-size="10">物料到货预警</text>
  </g>

  <!-- Leader -> Teammates -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M440 210 C 300 210, 180 220, 135 235"/>
    <path d="M460 210 C 380 210, 320 220, 300 235"/>
    <path d="M480 210 L 465 235"/>
    <path d="M500 210 C 560 210, 610 220, 630 235"/>
    <path d="M520 210 C 660 210, 760 220, 810 235"/>
  </g>

  <!-- Teammates up to A2A -->
  <g stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowW)">
    <path d="M135 240 L 155 432"/>
    <path d="M300 240 L 325 432"/>
    <path d="M465 240 L 495 432"/>
    <path d="M630 240 L 665 432"/>
    <path d="M810 240 L 820 432"/>
  </g>

  <!-- Annotations -->
  <text x="918" y="445" text-anchor="end" fill="#475569" font-size="10">单向 / 受控下发 · 双向协议适配</text>
</svg>
