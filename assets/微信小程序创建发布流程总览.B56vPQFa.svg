<svg width="1040" height="620" viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="微信小程序创建到发布流程总览图">
  <defs>
    <linearGradient id="miniappBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FEF9"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="miniArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1000" height="580" rx="20" fill="url(#miniappBg)" stroke="#D7E7DD"/>
  <text x="520" y="68" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0F172A">微信小程序创建 - 发布流程总览</text>
  <text x="520" y="102" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">从注册账号、创建项目、开发联调，到提交审核和正式发布</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g filter="url(#cardShadow)">
      <rect x="35" y="150" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#BBF7D0"/>
      <circle cx="76" cy="190" r="19" fill="#DCFCE7"/>
      <text x="76" y="197" text-anchor="middle" font-size="18" font-weight="700" fill="#16A34A">1</text>
      <text x="117" y="184" font-size="17" font-weight="700" fill="#0F172A">注册小程序账号</text>
      <text x="117" y="211" font-size="13" fill="#64748B">完成主体信息、认证</text>
      <text x="117" y="232" font-size="13" fill="#64748B">与基础配置</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="365" y="150" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#BFDBFE"/>
      <circle cx="406" cy="190" r="19" fill="#DBEAFE"/>
      <text x="406" y="197" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">2</text>
      <text x="447" y="184" font-size="17" font-weight="700" fill="#0F172A">创建小程序项目</text>
      <text x="447" y="214" font-size="13" fill="#64748B">获取 AppID，选择项目模板</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="695" y="150" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#FED7AA"/>
      <circle cx="736" cy="190" r="19" fill="#FFEDD5"/>
      <text x="736" y="197" text-anchor="middle" font-size="18" font-weight="700" fill="#EA580C">3</text>
      <text x="777" y="184" font-size="17" font-weight="700" fill="#0F172A">配置开发环境</text>
      <text x="777" y="211" font-size="13" fill="#64748B">安装微信开发者工具</text>
      <text x="777" y="232" font-size="13" fill="#64748B">并导入项目</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="695" y="320" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#C4B5FD"/>
      <circle cx="736" cy="360" r="19" fill="#EDE9FE"/>
      <text x="736" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">4</text>
      <text x="777" y="354" font-size="17" font-weight="700" fill="#0F172A">开发页面和接口</text>
      <text x="777" y="381" font-size="13" fill="#64748B">完成前端页面、后端接口</text>
      <text x="777" y="402" font-size="13" fill="#64748B">和数据联调</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="365" y="320" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#99F6E4"/>
      <circle cx="406" cy="360" r="19" fill="#CCFBF1"/>
      <text x="406" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#0D9488">5</text>
      <text x="447" y="354" font-size="17" font-weight="700" fill="#0F172A">预览和真机调试</text>
      <text x="447" y="381" font-size="13" fill="#64748B">扫码预览，检查权限、网络</text>
      <text x="447" y="402" font-size="13" fill="#64748B">和兼容性</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="35" y="320" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#FBCFE8"/>
      <circle cx="76" cy="360" r="19" fill="#FCE7F3"/>
      <text x="76" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#DB2777">6</text>
      <text x="117" y="354" font-size="17" font-weight="700" fill="#0F172A">上传版本并审核</text>
      <text x="117" y="381" font-size="13" fill="#64748B">提交体验版、填写版本说明</text>
      <text x="117" y="402" font-size="13" fill="#64748B">和审核资料</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="250" y="475" width="540" height="76" rx="16" fill="#FFFFFF" stroke="#86EFAC"/>
      <circle cx="300" cy="513" r="19" fill="#DCFCE7"/>
      <text x="300" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#16A34A">7</text>
      <text x="344" y="507" font-size="18" font-weight="700" fill="#0F172A">正式发布上线</text>
      <text x="344" y="534" font-size="13" fill="#64748B">审核通过后发布版本，并持续观察反馈和数据</text>
    </g>

    <path d="M 353 201 H 357" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
    <path d="M 683 201 H 687" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
    <path d="M 850 264 V 308" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
    <path d="M 683 371 H 687" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
    <path d="M 353 371 H 357" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
    <path d="M 190 434 C 190 462 220 513 238 513" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#miniArrow)"/>
  </g>

  <text x="520" y="574" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">关键节点：账号与 AppID 准备、开发者工具导入、真机验证、提交审核、审核通过后发布。</text>
</svg>
