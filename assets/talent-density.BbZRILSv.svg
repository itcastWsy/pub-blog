<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">人数规模与人才密度对比</title>
  <desc id="desc">左侧展示人数多但连接混乱的团队，右侧展示人数少但人才密度更高、协作更清晰的团队。</desc>
  <rect width="900" height="420" rx="0" fill="#F6F8FC"/>
  <rect x="50" y="54" width="360" height="300" rx="18" fill="#FFFFFF" stroke="#D9E0EE"/>
  <rect x="490" y="54" width="360" height="300" rx="18" fill="#FFFFFF" stroke="#D9E0EE"/>
  <text x="230" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172554">人数很多</text>
  <text x="670" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172554">人才密度高</text>
  <text x="230" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748B">沟通链路长，产出被稀释</text>
  <text x="670" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748B">判断清晰，协作更短</text>

  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="160" y1="190" x2="230" y2="230"/>
    <line x1="230" y1="230" x2="300" y2="190"/>
    <line x1="160" y1="270" x2="230" y2="230"/>
    <line x1="230" y1="230" x2="300" y2="270"/>
    <line x1="125" y1="230" x2="335" y2="230"/>
    <line x1="160" y1="190" x2="300" y2="270"/>
    <line x1="300" y1="190" x2="160" y2="270"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="125" cy="230" r="18"/>
    <circle cx="160" cy="190" r="18"/>
    <circle cx="230" cy="230" r="18"/>
    <circle cx="300" cy="190" r="18"/>
    <circle cx="335" cy="230" r="18"/>
    <circle cx="160" cy="270" r="18"/>
    <circle cx="300" cy="270" r="18"/>
  </g>
  <path d="M130 320H330" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <text x="230" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#B91C1C">规模不等于效率</text>

  <g stroke="#2563EB" stroke-width="5" stroke-linecap="round">
    <line x1="610" y1="230" x2="670" y2="190"/>
    <line x1="670" y1="190" x2="730" y2="230"/>
    <line x1="610" y1="230" x2="670" y2="274"/>
    <line x1="670" y1="274" x2="730" y2="230"/>
  </g>
  <g fill="#1D4ED8">
    <circle cx="610" cy="230" r="24"/>
    <circle cx="670" cy="190" r="24"/>
    <circle cx="730" cy="230" r="24"/>
    <circle cx="670" cy="274" r="24"/>
  </g>
  <circle cx="670" cy="230" r="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="670" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">结果</text>
  <path d="M570 320H770" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
  <text x="670" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#15803D">少数强节点也能高产出</text>
</svg>
