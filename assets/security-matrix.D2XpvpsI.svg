<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#sbg2)"/>
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">异构通信安全：三级动作 + 分层策略矩阵</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-size="12">allow / ask / deny × 参数级规则 × 工作区外路径</text>

  <!-- severity table -->
  <g font-size="13">
    <!-- header -->
    <rect x="60" y="90" width="180" height="40" rx="6" fill="#1e293b"/>
    <text x="150" y="115" text-anchor="middle" fill="#94a3b8">severity \ 模式</text>
    <rect x="240" y="90" width="160" height="40" rx="6" fill="#0ea5e9"/>
    <text x="320" y="115" text-anchor="middle" fill="#0b1220" font-weight="700">normal 模式</text>
    <rect x="400" y="90" width="160" height="40" rx="6" fill="#f59e0b"/>
    <text x="480" y="115" text-anchor="middle" fill="#0b1220" font-weight="700">strict 模式</text>
    <rect x="560" y="90" width="280" height="40" rx="6" fill="#1e293b"/>
    <text x="700" y="115" text-anchor="middle" fill="#94a3b8">产线场景举例</text>

    <!-- rows -->
    <g font-size="12" fill="#e2e8f0">
      <rect x="60" y="130" width="180" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="150" y="158" text-anchor="middle">LOW（读状态）</text>
      <rect x="240" y="130" width="160" height="44" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="320" y="158" text-anchor="middle" fill="#34d399" font-weight="700">allow</text>
      <rect x="400" y="130" width="160" height="44" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="480" y="158" text-anchor="middle" fill="#34d399" font-weight="700">allow</text>
      <rect x="560" y="130" width="280" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="700" y="158" text-anchor="middle" fill="#cbd5e1">读取机械臂当前坐标</text>

      <rect x="60" y="176" width="180" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="150" y="204" text-anchor="middle">MEDIUM（参数下发）</text>
      <rect x="240" y="176" width="160" height="44" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="320" y="204" text-anchor="middle" fill="#34d399" font-weight="700">allow</text>
      <rect x="400" y="176" width="160" height="44" rx="6" fill="#78350f" stroke="#f59e0b"/>
      <text x="480" y="204" text-anchor="middle" fill="#fbbf24" font-weight="700">ask</text>
      <rect x="560" y="176" width="280" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="700" y="204" text-anchor="middle" fill="#cbd5e1">下发主轴转速 12000rpm</text>

      <rect x="60" y="222" width="180" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="150" y="250" text-anchor="middle">HIGH（动作类）</text>
      <rect x="240" y="222" width="160" height="44" rx="6" fill="#78350f" stroke="#f59e0b"/>
      <text x="320" y="250" text-anchor="middle" fill="#fbbf24" font-weight="700">ask</text>
      <rect x="400" y="222" width="160" height="44" rx="6" fill="#78350f" stroke="#f59e0b"/>
      <text x="480" y="250" text-anchor="middle" fill="#fbbf24" font-weight="700">ask</text>
      <rect x="560" y="222" width="280" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="700" y="250" text-anchor="middle" fill="#cbd5e1">机械臂取放 / AGV 移动</text>

      <rect x="60" y="268" width="180" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="150" y="296" text-anchor="middle">CRITICAL（高危）</text>
      <rect x="240" y="268" width="160" height="44" rx="6" fill="#78350f" stroke="#f59e0b"/>
      <text x="320" y="296" text-anchor="middle" fill="#fbbf24" font-weight="700">ask</text>
      <rect x="400" y="268" width="160" height="44" rx="6" fill="#7f1d1d" stroke="#f43f5e"/>
      <text x="480" y="296" text-anchor="middle" fill="#fca5a5" font-weight="700">deny</text>
      <rect x="560" y="268" width="280" height="44" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="700" y="296" text-anchor="middle" fill="#cbd5e1">整线急停 / 修改安全围栏</text>
    </g>
  </g>

  <!-- pipeline of policy layers -->
  <text x="60" y="350" fill="#94a3b8" font-size="13" font-weight="700">分层判定流程（evaluate_tiered_policy）</text>
  <g font-size="11">
    <rect x="60" y="365" width="130" height="40" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="125" y="382" text-anchor="middle" fill="#cbd5e1">1.整工具基线</text>
    <text x="125" y="398" text-anchor="middle" fill="#64748b" font-size="10">deny 立即返回</text>
    <rect x="200" y="365" width="130" height="40" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="265" y="382" text-anchor="middle" fill="#cbd5e1">2.内置安全规则</text>
    <text x="265" y="398" text-anchor="middle" fill="#64748b" font-size="10">内置 deny 优先</text>
    <rect x="340" y="365" width="130" height="40" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="405" y="382" text-anchor="middle" fill="#cbd5e1">3.用户参数规则</text>
    <text x="405" y="398" text-anchor="middle" fill="#64748b" font-size="10">deny 早于 override</text>
    <rect x="480" y="365" width="130" height="40" rx="8" fill="#020617" stroke="#10b981"/>
    <text x="545" y="382" text-anchor="middle" fill="#34d399">4.approval_overrides</text>
    <text x="545" y="398" text-anchor="middle" fill="#64748b" font-size="10">“总是允许”命中即 allow</text>
    <rect x="620" y="365" width="130" height="40" rx="8" fill="#020617" stroke="#f59e0b"/>
    <text x="685" y="382" text-anchor="middle" fill="#fbbf24">5.外部目录检查</text>
    <text x="685" y="398" text-anchor="middle" fill="#64748b" font-size="10">workspace 外 strictest</text>
    <rect x="760" y="365" width="100" height="40" rx="8" fill="#020617" stroke="#7c3aed"/>
    <text x="810" y="382" text-anchor="middle" fill="#c4b5fd">6.shell 注入升阶</text>
    <text x="810" y="398" text-anchor="middle" fill="#64748b" font-size="10">allow→ask</text>
  </g>

  <!-- highlights -->
  <g font-size="12" fill="#cbd5e1">
    <text x="60" y="445">▸ <tspan fill="#34d399" font-weight="700">approval_overrides</tspan>：把“每次都要点确认”的高频操作持久化为 allow，但无法绕过内置 deny。</text>
    <text x="60" y="468">▸ <tspan fill="#fbbf24" font-weight="700">external_directory</tspan>：MES 数据库 / 产线配方目录属工作区外，单独走路径校验。</text>
    <text x="60" y="491">▸ <tspan fill="#c4b5fd" font-weight="700">shell_operators 升阶</tspan>：含管道 / 提权 / 远程下载的命令即使配置 allow 也会被升为 ask。</text>
  </g>
</svg>
