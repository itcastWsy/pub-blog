<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Georgia','Microsoft YaHei',serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="860" height="460" fill="url(#rbg)"/>
  <rect x="0" y="0" width="6" height="460" fill="#1e3a5f"/>
  <text x="430" y="34" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">合同风险标注：条款级风险矩阵</text>
  <text x="430" y="55" text-anchor="middle" fill="#475569" font-size="12">对照条款库 + 法规 → 高/中/低分级 + 修改建议</text>

  <!-- header row (法律表格风：细线、左对齐) -->
  <g font-size="12">
    <rect x="40" y="80" width="200" height="38" fill="#1e3a5f"/>
    <text x="55" y="104" fill="#fff" font-weight="700">条款类型</text>
    <rect x="240" y="80" width="90" height="38" fill="#991b1b"/>
    <text x="285" y="104" text-anchor="middle" fill="#fff" font-weight="700">高风险</text>
    <rect x="330" y="80" width="90" height="38" fill="#b45309"/>
    <text x="375" y="104" text-anchor="middle" fill="#fff" font-weight="700">中风险</text>
    <rect x="420" y="80" width="90" height="38" fill="#166534"/>
    <text x="465" y="104" text-anchor="middle" fill="#fff" font-weight="700">低/正常</text>
    <rect x="510" y="80" width="310" height="38" fill="#1e3a5f"/>
    <text x="665" y="104" text-anchor="middle" fill="#fff" font-weight="700">典型问题 · 修改建议方向</text>
  </g>

  <!-- rows (横线分隔，无圆角) -->
  <g font-size="11.5" fill="#1e293b">
    <rect x="40" y="122" width="200" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="55" y="149">责任限制条款</text>
    <rect x="240" y="122" width="90" height="44" fill="#fef2f2" stroke="#cbd5e1"/>
    <text x="285" y="149" text-anchor="middle" fill="#991b1b" font-weight="700">●</text>
    <rect x="330" y="122" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="420" y="122" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="510" y="122" width="310" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="665" y="142" text-anchor="middle" fill="#334155">无上限 / 间接损失未排除</text>
    <text x="665" y="158" text-anchor="middle" fill="#64748b" font-size="10">建议：上限取合同额1倍 + 排除间接损失</text>

    <rect x="40" y="166" width="200" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="55" y="193">付款条件</text>
    <rect x="240" y="166" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="330" y="166" width="90" height="44" fill="#fffbeb" stroke="#cbd5e1"/>
    <text x="375" y="193" text-anchor="middle" fill="#b45309" font-weight="700">●</text>
    <rect x="420" y="166" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="510" y="166" width="310" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="665" y="186" text-anchor="middle" fill="#334155">预付比例过高 / 账期过短</text>
    <text x="665" y="202" text-anchor="middle" fill="#64748b" font-size="10">建议：预付≤30%，账期≥45天</text>

    <rect x="40" y="210" width="200" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="55" y="237">知识产权归属</text>
    <rect x="240" y="210" width="90" height="44" fill="#fef2f2" stroke="#cbd5e1"/>
    <text x="285" y="237" text-anchor="middle" fill="#991b1b" font-weight="700">●</text>
    <rect x="330" y="210" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="420" y="210" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="510" y="210" width="310" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="665" y="230" text-anchor="middle" fill="#334155">衍生成果全归对方</text>
    <text x="665" y="246" text-anchor="middle" fill="#64748b" font-size="10">建议：背景IP各自保留，衍生按约定</text>

    <rect x="40" y="254" width="200" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="55" y="281">数据合规</text>
    <rect x="240" y="254" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="330" y="254" width="90" height="44" fill="#fffbeb" stroke="#cbd5e1"/>
    <text x="375" y="281" text-anchor="middle" fill="#b45309" font-weight="700">●</text>
    <rect x="420" y="254" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="510" y="254" width="310" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="665" y="274" text-anchor="middle" fill="#334155">跨境传输未约定 / 缺个人条款</text>
    <text x="665" y="290" text-anchor="middle" fill="#64748b" font-size="10">建议：补充GDPR/个保法合规条款</text>

    <rect x="40" y="298" width="200" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="55" y="325">终止/解约</text>
    <rect x="240" y="298" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="330" y="298" width="90" height="44" fill="#fff" stroke="#cbd5e1"/>
    <rect x="420" y="298" width="90" height="44" fill="#f0fdf4" stroke="#cbd5e1"/>
    <text x="465" y="325" text-anchor="middle" fill="#166534" font-weight="700">●</text>
    <rect x="510" y="298" width="310" height="44" fill="#fff" stroke="#cbd5e1"/>
    <text x="665" y="325" text-anchor="middle" fill="#334155">常规条款 · 双方对等</text>
  </g>

  <!-- footer (法律条文风：§ 符号) -->
  <rect x="40" y="370" width="780" height="70" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="394" fill="#475569" font-size="11" font-weight="700">§ 风险判定来源（多源融合）</text>
  <g font-size="11" fill="#334155">
    <text x="60" y="416">▸ <tspan fill="#991b1b" font-weight="700">高风险</tspan>：触发 H1 律师人工复核 · 命中条款库 [lesson] 已知坑 · 违反法规强制条款</text>
    <text x="60" y="434">▸ <tspan fill="#b45309" font-weight="700">中风险</tspan>：偏离行业范本 / 历史谈判惯例 · 由修改建议 Agent 给出改写方向</text>
    <text x="470" y="416">▸ <tspan fill="#166534" font-weight="700">低风险</tspan>：常规对等条款 · 自动放行</text>
    <text x="470" y="434">▸ 每次审查的新发现自动写入条款库</text>
  </g>
</svg>
