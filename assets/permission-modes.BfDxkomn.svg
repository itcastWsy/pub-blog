<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <linearGradient id="buildGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="goalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="16" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d3748">DevEco Code 三种权限模式对比</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0">按 Tab 键切换模式</text>

  <!-- Build Mode -->
  <g filter="url(#shadow3)">
    <rect x="30" y="80" width="260" height="280" rx="14" fill="white" stroke="url(#buildGrad)" stroke-width="2"/>
  </g>
  <!-- Header -->
  <rect x="30" y="80" width="260" height="50" rx="14" fill="url(#buildGrad)"/>
  <rect x="30" y="110" width="260" height="20" fill="url(#buildGrad)"/>
  <!-- Icon -->
  <text x="65" y="112" font-family="Arial, sans-serif" font-size="22">🔧</text>
  <text x="95" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Build</text>
  <text x="185" y="112" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">默认模式</text>
  <!-- Content -->
  <text x="160" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4facfe">动手干活的 Agent</text>
  <line x1="60" y1="168" x2="260" y2="168" stroke="#e2e8f0" stroke-width="1"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 工程生成</text>
  <text x="55" y="212" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 代码编写与修改</text>
  <text x="55" y="234" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 配置修正</text>
  <text x="55" y="256" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 测试执行</text>
  <text x="55" y="278" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 推包运行与发布</text>
  <!-- Use case -->
  <rect x="45" y="300" width="230" height="45" rx="8" fill="#ebf8ff"/>
  <text x="160" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2b6cb0" font-weight="bold">适用场景</text>
  <text x="160" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">日常编码、修 Bug、跑构建</text>

  <!-- Plan Mode -->
  <g filter="url(#shadow3)">
    <rect x="320" y="80" width="260" height="280" rx="14" fill="white" stroke="url(#planGrad)" stroke-width="2"/>
  </g>
  <rect x="320" y="80" width="260" height="50" rx="14" fill="url(#planGrad)"/>
  <rect x="320" y="110" width="260" height="20" fill="url(#planGrad)"/>
  <text x="355" y="112" font-family="Arial, sans-serif" font-size="22">📋</text>
  <text x="385" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Plan</text>
  <text x="450" y="112" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">规划模式</text>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8b5cf6">只出方案不敲代码</text>
  <line x1="350" y1="168" x2="550" y2="168" stroke="#e2e8f0" stroke-width="1"/>
  <text x="345" y="190" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 需求拆解</text>
  <text x="345" y="212" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 技术方案设计</text>
  <text x="345" y="234" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 发布规划</text>
  <text x="345" y="256" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 测试规划</text>
  <text x="345" y="278" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">• 文档生成</text>
  <rect x="335" y="300" width="230" height="45" rx="8" fill="#f5f3ff"/>
  <text x="450" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9" font-weight="bold">适用场景</text>
  <text x="450" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">方案输出、拆解需求</text>

  <!-- Goal Mode -->
  <g filter="url(#shadow3)">
    <rect x="610" y="80" width="260" height="280" rx="14" fill="white" stroke="url(#goalGrad)" stroke-width="2"/>
  </g>
  <rect x="610" y="80" width="260" height="50" rx="14" fill="url(#goalGrad)"/>
  <rect x="610" y="110" width="260" height="20" fill="url(#goalGrad)"/>
  <text x="645" y="112" font-family="Arial, sans-serif" font-size="22">🎯</text>
  <text x="675" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Goal</text>
  <text x="745" y="112" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">项目经理模式</text>
  <text x="740" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f5576c">端到端特性交付</text>
  <line x1="640" y1="168" x2="840" y2="168" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 5 Phases as mini steps -->
  <rect x="630" y="178" width="42" height="26" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="651" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c53030">需求</text>

  <text x="677" y="195" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">→</text>

  <rect x="688" y="178" width="42" height="26" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="709" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c53030">架构</text>

  <text x="735" y="195" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">→</text>

  <rect x="746" y="178" width="42" height="26" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="767" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c53030">拆解</text>

  <text x="793" y="195" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">→</text>

  <rect x="804" y="178" width="42" height="26" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="825" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c53030">实现</text>

  <text x="651" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">↻</text>
  <text x="660" y="220" font-family="Arial, sans-serif" font-size="9" fill="#a0aec0">多轮推进</text>

  <rect x="630" y="232" width="220" height="26" rx="5" fill="#fff5f5" stroke="#f5576c" stroke-width="1.5"/>
  <text x="740" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c53030" font-weight="bold">验证与确认 ✓</text>

  <text x="635" y="278" font-family="Arial, sans-serif" font-size="11" fill="#718096">SDD 规格驱动开发</text>
  <text x="635" y="296" font-family="Arial, sans-serif" font-size="11" fill="#718096">多轮迭代直到目标完成</text>

  <rect x="625" y="308" width="230" height="40" rx="8" fill="#fff5f5"/>
  <text x="740" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c53030" font-weight="bold">适用场景</text>
  <text x="740" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">复杂端到端特性交付</text>

  <!-- Bottom complexity bar -->
  <text x="50" y="390" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">复杂度</text>
  <rect x="100" y="380" width="720" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="100" y="380" width="200" height="8" rx="4" fill="url(#buildGrad)"/>
  <rect x="310" y="380" width="220" height="8" rx="4" fill="url(#planGrad)"/>
  <rect x="540" y="380" width="280" height="8" rx="4" fill="url(#goalGrad)"/>
  <text x="830" y="390" font-family="Arial, sans-serif" font-size="11" fill="#f5576c">高</text>
</svg>