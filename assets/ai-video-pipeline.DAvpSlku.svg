<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI 视频流水线：从选题到成片</title>
  <desc id="desc">流程展示：选题资料进入 Codex，生成脚本后拆分分镜和字幕，再分别进入 HyperFrames 视频画面和 MiMo TTS 配音，最终合成视频音频字幕。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="52%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#fff8f2"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f97316"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .sub { font: 400 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4b5563; }
      .card-title { font: 700 22px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .card-sub { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #6b7280; }
      .tag { font: 700 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
      .note { font: 400 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .line-orange { fill: none; stroke: #f97316; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1020" cy="88" r="120" fill="#dbeafe" opacity="0.45"/>
  <circle cx="160" cy="440" r="150" fill="#ffedd5" opacity="0.55"/>
  <path d="M76 410 C240 330 360 470 520 390 S820 320 1090 420" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <text x="70" y="72" class="title">AI 视频流水线</text>
  <text x="70" y="105" class="sub">Codex 写脚本，HyperFrames 出画面，MiMo TTS 生成声音，最后合成视频、音频和字幕。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="178" height="112" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <rect x="92" y="162" width="82" height="28" rx="14" fill="url(#primary)"/>
    <text x="112" y="181" class="tag">输入</text>
    <text x="104" y="230" class="card-title">选题/资料</text>
    <text x="104" y="260" class="card-sub">热点、文档、链接</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="315" y="185" width="190" height="112" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="337" y="162" width="92" height="28" rx="14" fill="url(#primary)"/>
    <text x="354" y="181" class="tag">脚本</text>
    <text x="354" y="230" class="card-title">Codex</text>
    <text x="354" y="260" class="card-sub">生成口播和结构</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="575" y="185" width="210" height="112" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="597" y="162" width="110" height="28" rx="14" fill="url(#primary)"/>
    <text x="620" y="181" class="tag">拆解</text>
    <text x="615" y="230" class="card-title">分镜 + 字幕</text>
    <text x="615" y="260" class="card-sub">画面节奏与字幕稿</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="135" width="218" height="112" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <rect x="872" y="112" width="112" height="28" rx="14" fill="url(#primary)"/>
    <text x="895" y="131" class="tag">画面</text>
    <text x="890" y="180" class="card-title">HyperFrames</text>
    <text x="890" y="210" class="card-sub">生成视频画面</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="305" width="218" height="112" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="872" y="282" width="112" height="28" rx="14" fill="url(#accent)"/>
    <text x="895" y="301" class="tag">声音</text>
    <text x="890" y="350" class="card-title">MiMo TTS</text>
    <text x="890" y="380" class="card-sub">生成旁白配音</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="210" width="122" height="96" rx="18" fill="#111827"/>
    <text x="1053" y="252" class="card-title" fill="#ffffff">成片</text>
    <text x="1042" y="282" class="card-sub" fill="#cbd5e1">视频+音频+字幕</text>
  </g>

  <path class="line-blue" d="M248 241 H305"/>
  <path class="line-blue" d="M505 241 H565"/>
  <path class="line-blue" d="M785 241 C810 241 820 191 842 191"/>
  <path class="line-orange" d="M785 241 C810 241 820 361 842 361"/>
  <path class="line-blue" d="M1068 191 C1110 191 1112 226 1114 252"/>
  <path class="line-orange" d="M1068 361 C1110 361 1112 292 1114 270"/>

  <g opacity="0.95">
    <rect x="575" y="348" width="210" height="54" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="610" y="381" class="note">字幕从脚本生成，再按音频校准</text>
  </g>
</svg>
