<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MiMo TTS 声音实验室</title>
  <desc id="desc">信息图展示 MiMo TTS 的内置音色、VoiceDesign、VoiceClone，以及语速、情绪、风格等可控参数。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="52%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 38px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; }
      .card-title { font: 700 24px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .card-sub { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .knob { font: 700 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .badge { font: 700 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="70" y="76" class="title">MiMo TTS：不是朗读器，是声音生产工具</text>
  <text x="70" y="112" class="sub">同一段脚本，可以用不同音色、语速、情绪和角色感做 A/B 测试。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="170" width="310" height="218" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <circle cx="132" cy="230" r="32" fill="#dbeafe"/>
    <path d="M120 230 C130 206 145 206 153 230 C145 254 130 254 120 230Z" fill="#2563eb"/>
    <text x="112" y="296" class="card-title">内置音色</text>
    <text x="112" y="328" class="card-sub">适合快速生成稳定旁白</text>
    <rect x="112" y="348" width="118" height="28" rx="14" fill="#2563eb"/>
    <text x="134" y="367" class="badge">mimo-v2.5-tts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="170" width="310" height="218" rx="24" fill="#ffffff" stroke="#bae6fd"/>
    <circle cx="505" cy="230" r="32" fill="#cffafe"/>
    <path d="M489 230 H521 M505 214 V246" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/>
    <text x="485" y="296" class="card-title">VoiceDesign</text>
    <text x="485" y="328" class="card-sub">用文字描述定制声音</text>
    <rect x="485" y="348" width="170" height="28" rx="14" fill="#0891b2"/>
    <text x="507" y="367" class="badge">tts-voicedesign</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="818" y="170" width="310" height="218" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <circle cx="878" cy="230" r="32" fill="#ffedd5"/>
    <path d="M864 232 C876 210 893 210 904 232 C892 254 876 254 864 232Z" fill="#f97316"/>
    <path d="M884 214 V250" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="858" y="296" class="card-title">VoiceClone</text>
    <text x="858" y="328" class="card-sub">基于样本复刻声音风格</text>
    <rect x="858" y="348" width="164" height="28" rx="14" fill="#f97316"/>
    <text x="880" y="367" class="badge">tts-voiceclone</text>
  </g>

  <path d="M110 440 C150 380 190 500 230 440 S310 380 350 440 S430 500 470 440 S550 380 590 440 S670 500 710 440 S790 380 830 440 S910 500 950 440 S1030 380 1070 440" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round"/>

  <g>
    <rect x="258" y="424" width="94" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="289" y="447" class="knob">语速</text>
    <rect x="406" y="424" width="94" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="437" y="447" class="knob">情绪</text>
    <rect x="554" y="424" width="94" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="585" y="447" class="knob">角色</text>
    <rect x="702" y="424" width="94" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="733" y="447" class="knob">方言</text>
    <rect x="850" y="424" width="94" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="881" y="447" class="knob">风格</text>
  </g>
</svg>
