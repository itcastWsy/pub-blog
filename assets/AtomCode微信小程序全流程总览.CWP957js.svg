<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AtomCode 开发微信小程序全流程总览图">
  <defs>
    <linearGradient id="overviewBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="920" height="480" rx="18" fill="url(#overviewBg)" stroke="#D8E4F0"/>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0F172A">AtomCode 开发微信小程序全流程</text>
  <text x="480" y="96" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">从工具准备、AI 协同开发，到真机调试和发布上线</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g filter="url(#softShadow)">
      <rect x="45" y="145" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#BFDBFE"/>
      <circle cx="82" cy="182" r="18" fill="#DBEAFE"/>
      <text x="82" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">1</text>
      <text x="118" y="177" font-size="17" font-weight="700" fill="#0F172A">认识 AtomCode</text>
      <text x="118" y="206" font-size="13" fill="#64748B">了解定位与能力边界</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="340" y="145" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#BBF7D0"/>
      <circle cx="377" cy="182" r="18" fill="#DCFCE7"/>
      <text x="377" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#16A34A">2</text>
      <text x="413" y="177" font-size="17" font-weight="700" fill="#0F172A">安装与上手</text>
      <text x="413" y="206" font-size="13" fill="#64748B">下载、配置、基础使用</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="635" y="145" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#FED7AA"/>
      <circle cx="672" cy="182" r="18" fill="#FFEDD5"/>
      <text x="672" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#EA580C">3</text>
      <text x="708" y="177" font-size="17" font-weight="700" fill="#0F172A">创建小程序</text>
      <text x="708" y="206" font-size="13" fill="#64748B">账号、项目、开发工具</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="635" y="315" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#C4B5FD"/>
      <circle cx="672" cy="352" r="18" fill="#EDE9FE"/>
      <text x="672" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">4</text>
      <text x="708" y="347" font-size="17" font-weight="700" fill="#0F172A">协同开发</text>
      <text x="708" y="376" font-size="13" fill="#64748B">客户端、后端、接口联调</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="340" y="315" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#99F6E4"/>
      <circle cx="377" cy="352" r="18" fill="#CCFBF1"/>
      <text x="377" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#0D9488">5</text>
      <text x="413" y="347" font-size="17" font-weight="700" fill="#0F172A">真机调试</text>
      <text x="413" y="376" font-size="13" fill="#64748B">预览、调试、修复问题</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="45" y="315" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#FBCFE8"/>
      <circle cx="82" cy="352" r="18" fill="#FCE7F3"/>
      <text x="82" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#DB2777">6</text>
      <text x="118" y="347" font-size="17" font-weight="700" fill="#0F172A">发布上线</text>
      <text x="118" y="376" font-size="13" fill="#64748B">上传、审核、发布版本</text>
    </g>

    <path d="M 305 193 H 328" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 600 193 H 623" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 760 251 V 303" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 623 363 H 602" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 328 363 H 307" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <text x="480" y="462" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B">建议阅读顺序：先完成工具和账号准备，再进入 AI 辅助开发、联调、测试和上线。</text>
</svg>
