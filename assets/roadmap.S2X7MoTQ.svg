<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <marker id="ra2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="url(#lbg)"/>
  <text x="480" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">产线 Agent 化落地路线图：四阶段演进</text>
  <text x="480" y="60" text-anchor="middle" fill="#64748b" font-size="12">从单机验证 → 技能治理 → 安全上线 → 分布式扩展（每阶段在前一阶段基础上叠加，不推翻重来）</text>

  <!-- time axis line -->
  <line x1="80" y1="180" x2="880" y2="180" stroke="#1e293b" stroke-width="3"/>
  <text x="80" y="170" fill="#475569" font-size="11">起步</text>
  <text x="880" y="170" text-anchor="end" fill="#475569" font-size="11">规模扩展</text>

  <!-- Stage 1 -->
  <g>
    <rect x="50" y="130" width="180" height="100" rx="12" fill="url(#s1)"/>
    <text x="140" y="158" text-anchor="middle" fill="#0b1220" font-size="14" font-weight="700">阶段 1 · 最小产线</text>
    <text x="140" y="180" text-anchor="middle" fill="#0b1220" font-size="11">单机 · 本地模式</text>
    <text x="140" y="200" text-anchor="middle" fill="#0b1220" font-size="11">1 Leader + 2~3 Teammate</text>
    <text x="140" y="218" text-anchor="middle" fill="#0b1220" font-size="11">验证 DAG + 团队记忆</text>
    <circle cx="140" cy="180" r="9" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="140" cy="180" r="3" fill="#22d3ee"/>
  </g>

  <!-- arrow 1->2 -->
  <line x1="234" y1="180" x2="270" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ra2)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="275" y="130" width="180" height="100" rx="12" fill="url(#s2)"/>
    <text x="365" y="158" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">阶段 2 · 技能治理</text>
    <text x="365" y="180" text-anchor="middle" fill="#ede9fe" font-size="11">Skill &gt; 20 个时开启</text>
    <text x="365" y="200" text-anchor="middle" fill="#ede9fe" font-size="11">Symphony 检索树 + 总谱</text>
    <text x="365" y="218" text-anchor="middle" fill="#ede9fe" font-size="11">自动选链，告别硬编码</text>
    <circle cx="365" cy="180" r="9" fill="#0b1220" stroke="#a855f7" stroke-width="2"/>
    <circle cx="365" cy="180" r="3" fill="#a855f7"/>
  </g>

  <!-- arrow 2->3 -->
  <line x1="459" y1="180" x2="495" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ra2)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="500" y="130" width="180" height="100" rx="12" fill="url(#s3)"/>
    <text x="590" y="158" text-anchor="middle" fill="#0b1220" font-size="14" font-weight="700">阶段 3 · 安全上线</text>
    <text x="590" y="180" text-anchor="middle" fill="#0b1220" font-size="11">permission_mode: strict</text>
    <text x="590" y="200" text-anchor="middle" fill="#0b1220" font-size="11">高危 deny/ask · 低频 allow</text>
    <text x="590" y="218" text-anchor="middle" fill="#0b1220" font-size="11">approval_overrides 省确认</text>
    <circle cx="590" cy="180" r="9" fill="#0b1220" stroke="#f97316" stroke-width="2"/>
    <circle cx="590" cy="180" r="3" fill="#f97316"/>
  </g>

  <!-- arrow 3->4 -->
  <line x1="684" y1="180" x2="720" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ra2)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="725" y="130" width="185" height="100" rx="12" fill="url(#s4)"/>
    <text x="817" y="158" text-anchor="middle" fill="#0b1220" font-size="14" font-weight="700">阶段 4 · 分布式扩展</text>
    <text x="817" y="180" text-anchor="middle" fill="#0b1220" font-size="11">跨厂区协同</text>
    <text x="817" y="200" text-anchor="middle" fill="#0b1220" font-size="11">A2X 注册中心 + PG + NFS</text>
    <text x="817" y="218" text-anchor="middle" fill="#0b1220" font-size="11">设备 Agent 下沉到工控机</text>
    <circle cx="817" cy="180" r="9" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <circle cx="817" cy="180" r="3" fill="#34d399"/>
  </g>

  <!-- 每阶段下方关键能力/产出 -->
  <g font-size="11">
    <!-- stage1 output -->
    <line x1="140" y1="230" x2="140" y2="260" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="55" y="262" width="170" height="62" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="140" y="282" text-anchor="middle" fill="#64748b">✓ 产出</text>
    <text x="140" y="300" text-anchor="middle" fill="#e2e8f0">跑通一条最小 DAG</text>
    <text x="140" y="316" text-anchor="middle" fill="#e2e8f0">团队记忆开始累积</text>

    <!-- stage2 output -->
    <line x1="365" y1="230" x2="365" y2="260" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="280" y="262" width="170" height="62" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="365" y="282" text-anchor="middle" fill="#64748b">✓ 产出</text>
    <text x="365" y="300" text-anchor="middle" fill="#e2e8f0">技能可发现/可编排</text>
    <text x="365" y="316" text-anchor="middle" fill="#e2e8f0">新设备接入零硬编码</text>

    <!-- stage3 output -->
    <line x1="590" y1="230" x2="590" y2="260" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="505" y="262" width="170" height="62" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="590" y="282" text-anchor="middle" fill="#64748b">✓ 产出</text>
    <text x="590" y="300" text-anchor="middle" fill="#e2e8f0">高危动作受控</text>
    <text x="590" y="316" text-anchor="middle" fill="#e2e8f0">可审计、可合规</text>

    <!-- stage4 output -->
    <line x1="817" y1="230" x2="817" y2="260" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="730" y="262" width="174" height="62" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="817" y="282" text-anchor="middle" fill="#64748b">✓ 产出</text>
    <text x="817" y="300" text-anchor="middle" fill="#e2e8f0">物理/协作拓扑分离</text>
    <text x="817" y="316" text-anchor="middle" fill="#e2e8f0">跨企业 A2A 协同</text>
  </g>

  <!-- bottom principle bar -->
  <rect x="50" y="360" width="860" height="78" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="480" y="386" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">核心原则</text>
  <g font-size="12.5" fill="#cbd5e1">
    <text x="80" y="412">▸ <tspan fill="#22d3ee" font-weight="700">增量演进</tspan>：后一阶段继承前一阶段的配置与记忆，不推翻重来</text>
    <text x="80" y="432">▸ <tspan fill="#a855f7" font-weight="700">先验证后治理</tspan>：先用最小闭环跑通业务，再上技能治理与安全策略</text>
    <text x="510" y="412">▸ <tspan fill="#f97316" font-weight="700">安全前置</tspan>：任何涉及物理设备动作的，上线前必须过 strict 策略</text>
    <text x="510" y="432">▸ <tspan fill="#34d399" font-weight="700">按需分布式</tspan>：单机能扛住就不上分布式，规模到了再拆</text>
  </g>
</svg>
